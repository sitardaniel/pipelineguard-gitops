apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sitardaniel/pipelineguard-gitops
    targetRevision: HEAD
    path: apps/config-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: baghguard
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: config-ui-secret
    jsonPointers:
    - /data
    - /stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
