apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sitardaniel/pipelineguard-gitops
    targetRevision: HEAD
    path: apps/config-ui
  destination:
    server: https://kubernetes.default.svc
    namespace: baghguard
  ignoreDifferences:
  - group: ""
    kind: Secret
    name: config-ui-secret
    jsonPointers:
    - /data
    - /stringData
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Without this, ignoreDifferences only hides the Secret from the diff/
    # OutOfSync status - any sync triggered for an unrelated reason (e.g.
    # the Deployment drifting) still re-applies the Secret's literal
    # manifest content, wiping the real live credentials back to git's
    # blank placeholders. RespectIgnoreDifferences makes sync itself skip
    # the ignored fields too, not just status reporting.
    - RespectIgnoreDifferences=true
