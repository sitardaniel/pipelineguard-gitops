apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: remediator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sitardaniel/pipelineguard-gitops
    targetRevision: HEAD
    path: apps/remediator
  destination:
    server: https://kubernetes.default.svc
    namespace: baghguard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
