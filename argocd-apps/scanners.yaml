apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scanners
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sitardaniel/pipelineguard-gitops
    targetRevision: HEAD
    path: apps/scanners
  destination:
    server: https://kubernetes.default.svc
    namespace: baghguard
  ignoreDifferences:
  - group: ""
    kind: ConfigMap
    name: scanner-config
    jsonPointers:
    - /data
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    # Without this, ignoreDifferences only hides scanner-config from the
    # diff/OutOfSync status - any sync triggered for an unrelated reason
    # still re-applies its literal (blank) TARGET_REPOS, silently deleting
    # every user's saved repo selection. Same root cause as the Secret
    # fixes in config-ui.yaml etc., just hitting a ConfigMap instead.
    - RespectIgnoreDifferences=true
