apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-alerter
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email-alerter
  template:
    metadata:
      labels:
        app: email-alerter
    spec:
      serviceAccountName: email-alerter
      containers:
      - name: alerter
        image: ghcr.io/sitardaniel/baghguard-email-alerter:207cdc8f2e9a3e4a822d5f1131326afa2f5463cb
        # IfNotPresent, not Always: the tag is now the immutable commit SHA
        # that built it (bumped in this manifest by build-images.yml's
        # update-gitops-manifests job) - a given tag never points to a
        # different image, so there's nothing to re-check on every restart.
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-host
              optional: true
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-user
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-password
              optional: true
        - name: SMTP_USE_TLS
          value: "true"
        - name: ALERT_EMAIL_FROM
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: alert-email-from
              optional: true
        - name: OPA_URL
          value: "http://opa:8181"
        - name: CHECK_INTERVAL_SECONDS
          value: "86400"  # once a day
        - name: ALERT_SEVERITIES
          value: "CRITICAL,HIGH"
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: email-alerter
  namespace: baghguard
