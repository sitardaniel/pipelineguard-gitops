apiVersion: v1
kind: Secret
metadata:
  name: email-alerter-secret
  namespace: baghguard
type: Opaque
stringData:
  # Replace with real SMTP credentials - one shared relay for every user's
  # digest. Also reused by config-ui for the waitlist "we're live" email.
  # Deliberately kept in its own file, separate from deployment.yaml: a
  # targeted `kubectl apply -f apps/email-alerter/deployment.yaml` must not
  # be able to reset these back to blank as a side effect. ArgoCD's own
  # sync/selfHeal is separately blocked from touching this via
  # ignoreDifferences + RespectIgnoreDifferences in
  # argocd-apps/email-alerter.yaml.
  smtp-host: ""
  smtp-user: ""
  smtp-password: ""
  alert-email-from: "baghguard@localhost"
