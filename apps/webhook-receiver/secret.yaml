apiVersion: v1
kind: Secret
metadata:
  name: webhook-secret
  namespace: baghguard
type: Opaque
stringData:
  # Must match the secret configured on the GitHub webhook for whichever
  # repo(s) point at this receiver. Deliberately left blank here, not a
  # real value: this repo is public, so anything committed here is not
  # actually secret. Populate with kubectl once, out of band. Kept in its
  # own file, separate from deployment.yaml, for the same reason as
  # config-ui-secret/email-alerter-secret - see argocd-apps/webhook-receiver.yaml
  # for the ignoreDifferences + RespectIgnoreDifferences that keep ArgoCD
  # from reverting a live value back to this placeholder.
  hmac-secret: ""
