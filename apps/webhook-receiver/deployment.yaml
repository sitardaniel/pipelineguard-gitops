apiVersion: v1
kind: ServiceAccount
metadata:
  name: webhook-receiver
  namespace: baghguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: webhook-receiver
  namespace: baghguard
rules:
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "list"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: webhook-receiver
  namespace: baghguard
subjects:
- kind: ServiceAccount
  name: webhook-receiver
  namespace: baghguard
roleRef:
  kind: Role
  name: webhook-receiver
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-receiver
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webhook-receiver
  template:
    metadata:
      labels:
        app: webhook-receiver
    spec:
      serviceAccountName: webhook-receiver
      containers:
      - name: webhook-receiver
        image: ghcr.io/sitardaniel/baghguard-webhook-receiver:fa5049fd8059f93e0c0907b53d3e6dfcbb410c5a
        # IfNotPresent, not Always: the tag is now the immutable commit SHA
        # that built it (bumped in this manifest by build-images.yml's
        # update-gitops-manifests job) - a given tag never points to a
        # different image, so there's nothing to re-check on every restart.
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: NAMESPACE
          value: baghguard
        - name: WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: webhook-secret
              key: hmac-secret
              optional: true
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: webhook-receiver
  namespace: baghguard
spec:
  selector:
    app: webhook-receiver
  ports:
  - port: 80
    targetPort: 8080
    name: http
