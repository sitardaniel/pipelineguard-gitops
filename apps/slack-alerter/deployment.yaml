apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-alerter
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-alerter
  template:
    metadata:
      labels:
        app: slack-alerter
    spec:
      serviceAccountName: slack-alerter
      containers:
      - name: alerter
        image: ghcr.io/sitardaniel/baghguard-slack-alerter:fa5049fd8059f93e0c0907b53d3e6dfcbb410c5a
        # IfNotPresent, not Always: the tag is now the immutable commit SHA
        # that built it (bumped in this manifest by build-images.yml's
        # update-gitops-manifests job) - a given tag never points to a
        # different image, so there's nothing to re-check on every restart.
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: OPA_URL
          value: "http://opa:8181"
        - name: POLL_INTERVAL
          value: "60"
        - name: ALERT_SEVERITIES
          value: "CRITICAL,HIGH"
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: slack-alerter
  namespace: baghguard
