apiVersion: v1
kind: Secret
metadata:
  name: postgresql-secret
  namespace: baghguard
type: Opaque
stringData:
  # This is the master DB credential - relied on by every other service
  # (config-ui, email-alerter, normalizer, remediator, slack-alerter) and
  # guards a database that stores real GitHub OAuth access tokens. Unlike
  # the other split-out secrets, this one can't just be left blank: the
  # postgres image requires POSTGRES_PASSWORD to be set to initialize a
  # fresh data directory at all. Treat this value as a bootstrap default
  # only - this repo is public, so it is not actually secret - and rotate
  # it immediately after first bringing up a cluster (requires an ALTER
  # ROLE inside Postgres itself, not just editing this Secret, since
  # Postgres only applies POSTGRES_PASSWORD on first initdb of a fresh
  # volume - changing this file alone does nothing once the PVC already
  # has data). Kept in its own file, separate from deployment.yaml, and
  # protected from ArgoCD reverting a rotated value via ignoreDifferences +
  # RespectIgnoreDifferences in argocd-apps/postgresql.yaml.
  POSTGRES_USER: baghguard
  POSTGRES_PASSWORD: localdevpassword
  POSTGRES_DB: baghguard
