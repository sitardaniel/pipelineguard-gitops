apiVersion: v1
kind: ConfigMap
metadata:
  name: postgresql-init-schema
  namespace: baghguard
data:
  init.sql: |
    -- BaghGuard Findings Schema
    CREATE TABLE IF NOT EXISTS findings (
      id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      repo          TEXT NOT NULL,
      scanner       TEXT NOT NULL,
      severity      TEXT NOT NULL,
      cve_id        TEXT,
      package       TEXT,
      file_path     TEXT,
      line_number   INTEGER,
      description   TEXT,
      fix_version   TEXT,
      status        TEXT DEFAULT 'open',
      scanned_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
      resolved_at   TIMESTAMPTZ
    );

    CREATE INDEX IF NOT EXISTS idx_findings_repo_severity ON findings (repo, severity);
    CREATE INDEX IF NOT EXISTS idx_findings_scanned_at ON findings (scanned_at DESC);
    CREATE INDEX IF NOT EXISTS idx_findings_status ON findings (status);
    CREATE INDEX IF NOT EXISTS idx_findings_scanner ON findings (scanner);

    -- Multi-user: each GitHub-authenticated user picks their own repos and
    -- sees only their own findings/alerts.
    CREATE TABLE IF NOT EXISTS users (
      id            UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      github_id     BIGINT UNIQUE NOT NULL,
      username      TEXT NOT NULL,
      avatar_url    TEXT,
      access_token  TEXT NOT NULL,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    CREATE TABLE IF NOT EXISTS sessions (
      token         TEXT PRIMARY KEY,
      user_id       UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      created_at    TIMESTAMPTZ NOT NULL DEFAULT now(),
      expires_at    TIMESTAMPTZ NOT NULL
    );

    CREATE TABLE IF NOT EXISTS user_repos (
      user_id       UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
      repo_url      TEXT NOT NULL,
      added_at      TIMESTAMPTZ NOT NULL DEFAULT now(),
      PRIMARY KEY (user_id, repo_url)
    );

    CREATE TABLE IF NOT EXISTS user_notify_settings (
      user_id            UUID PRIMARY KEY REFERENCES users(id) ON DELETE CASCADE,
      slack_webhook      TEXT,
      slack_enabled      BOOLEAN NOT NULL DEFAULT false,
      email_enabled      BOOLEAN NOT NULL DEFAULT false,
      email_to           TEXT,
      remediate_enabled  BOOLEAN NOT NULL DEFAULT false
    );

    ALTER TABLE user_notify_settings ADD COLUMN IF NOT EXISTS remediate_enabled BOOLEAN NOT NULL DEFAULT false;

    -- Auto-remediation: at most one fix-PR attempt per finding, ever. A row
    -- here (any status) means "don't retry this finding again" - this is
    -- what keeps the remediator's poll loop idempotent.
    CREATE TABLE IF NOT EXISTS remediation_prs (
      id           UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      finding_id   UUID NOT NULL UNIQUE REFERENCES findings(id) ON DELETE CASCADE,
      pr_url       TEXT,
      branch_name  TEXT,
      status       TEXT NOT NULL DEFAULT 'open', -- open, failed, unsupported
      detail       TEXT,
      created_at   TIMESTAMPTZ NOT NULL DEFAULT now()
    );

    ALTER TABLE findings ADD COLUMN IF NOT EXISTS owner_user_id UUID REFERENCES users(id);
    CREATE INDEX IF NOT EXISTS idx_findings_owner ON findings (owner_user_id);
    CREATE INDEX IF NOT EXISTS idx_sessions_expires ON sessions (expires_at);

    -- Waitlist: signing in with GitHub no longer grants immediate access.
    -- New accounts land as 'pending' and need an admin to approve them;
    -- this stays on permanently, not just pre-launch.
    ALTER TABLE users ADD COLUMN IF NOT EXISTS email TEXT;
    ALTER TABLE users ADD COLUMN IF NOT EXISTS approval_status TEXT NOT NULL DEFAULT 'pending';
    ALTER TABLE users ADD COLUMN IF NOT EXISTS approved_at TIMESTAMPTZ;
    ALTER TABLE users ADD COLUMN IF NOT EXISTS notified_live_at TIMESTAMPTZ;

    -- Grandfather in accounts that existed before this gate shipped, so
    -- nobody already using BaghGuard gets locked out by the new default.
    -- Fixed cutoff (not now()) so re-running this migration is idempotent
    -- and never auto-approves genuinely new signups. Must stay safely in
    -- the past relative to real UTC time when this ships - a "local
    -- today" date can still be UTC-yesterday for several hours, and this
    -- job reruns on every ArgoCD sync, so a cutoff that's even briefly in
    -- the future would keep auto-approving brand new signups until UTC
    -- catches up to it.
    UPDATE users SET approval_status = 'approved'
    WHERE approval_status = 'pending' AND created_at < '2026-07-12T12:00:00Z';

    CREATE INDEX IF NOT EXISTS idx_users_approval_status ON users (approval_status);

    -- View for open critical/high findings
    CREATE OR REPLACE VIEW critical_findings AS
    SELECT * FROM findings
    WHERE status = 'open'
      AND severity IN ('CRITICAL', 'HIGH')
    ORDER BY scanned_at DESC;

    -- View for findings summary by repo
    CREATE OR REPLACE VIEW findings_summary AS
    SELECT
      repo,
      scanner,
      severity,
      COUNT(*) as count
    FROM findings
    WHERE status = 'open'
    GROUP BY repo, scanner, severity
    ORDER BY repo, scanner, severity;

    -- Dedup: re-scans of the same persistent issue should update the
    -- existing row instead of inserting a new one every cycle. Collapse
    -- any duplicates that already accumulated before this constraint
    -- existed (most-recently-scanned row wins), then enforce uniqueness
    -- going forward. COALESCE handles nullable columns (cve_id/package
    -- are always NULL for gitleaks secret findings) since NULL <> NULL
    -- would otherwise defeat a plain unique constraint on those columns.
    DELETE FROM findings f
    USING findings f2
    WHERE f.id <> f2.id
      AND f.repo = f2.repo
      AND f.scanner = f2.scanner
      AND COALESCE(f.file_path, '') = COALESCE(f2.file_path, '')
      AND COALESCE(f.cve_id, '') = COALESCE(f2.cve_id, '')
      AND COALESCE(f.package, '') = COALESCE(f2.package, '')
      AND COALESCE(f.description, '') = COALESCE(f2.description, '')
      AND (f.scanned_at, f.id) < (f2.scanned_at, f2.id);

    CREATE UNIQUE INDEX IF NOT EXISTS idx_findings_dedup ON findings (
      repo, scanner,
      COALESCE(file_path, ''),
      COALESCE(cve_id, ''),
      COALESCE(package, ''),
      COALESCE(description, '')
    );

    -- line_number wasn't part of the dedup key above, so two genuinely
    -- distinct violations in the same file (e.g. the same Checkov check
    -- firing on two separate resource blocks) collided on an identical
    -- key - a single scan's batch insert could then contain two rows
    -- targeting the same key, which ON CONFLICT DO UPDATE cannot handle
    -- within one multi-row INSERT ("cannot affect row a second time").
    -- Widening the key only splits existing groups more finely, never
    -- merges them, so there's nothing to collapse - just rebuild the index.
    DROP INDEX IF EXISTS idx_findings_dedup;
    CREATE UNIQUE INDEX IF NOT EXISTS idx_findings_dedup ON findings (
      repo, scanner,
      COALESCE(file_path, ''),
      COALESCE(cve_id, ''),
      COALESCE(package, ''),
      COALESCE(description, ''),
      COALESCE(line_number, -1)
    );

    -- Exploit-intelligence enrichment (the `enricher` CronJob fills these from
    -- the EPSS feed and CISA KEV catalog). `priority` is recomputed from
    -- kev_listed + epss_score + severity so findings views can lead with what
    -- is actually exploitable instead of raw CVSS. All idempotent, so this Job
    -- keeps its name (the "rename for non-idempotent migrations" rule doesn't
    -- apply here).
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS epss_score      REAL;
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS epss_percentile REAL;
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS kev_listed      BOOLEAN NOT NULL DEFAULT false;
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS kev_added_date  DATE;
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS priority        TEXT;  -- URGENT|HIGH|MEDIUM|LOW
    CREATE INDEX IF NOT EXISTS idx_findings_cve ON findings (cve_id);

    -- Cross-scanner dedup identity. Two scanners reporting the same CVE for the
    -- same package/repo share a fingerprint (scanner deliberately omitted), so
    -- findings views can collapse trivy's and grype's copies into one row while
    -- the underlying per-scanner rows (and idx_findings_dedup) stay intact.
    -- Only real CVE-/GHSA- ids get scanner-independent grouping. checkov
    -- check_ids and trivy IaC misconfig ids also live in cve_id but are
    -- per-file/per-resource, so they keep scanner + file + line + description -
    -- grouping them on id alone would collapse two distinct violations of the
    -- same check into one row. The md5() expression MUST stay identical to
    -- normalizer.py's _fingerprint() or new rows won't group with backfilled ones.
    ALTER TABLE findings ADD COLUMN IF NOT EXISTS fingerprint TEXT;
    CREATE INDEX IF NOT EXISTS idx_findings_fingerprint ON findings (fingerprint);

    UPDATE findings SET fingerprint = CASE
      WHEN upper(COALESCE(cve_id, '')) LIKE 'CVE-%' OR upper(COALESCE(cve_id, '')) LIKE 'GHSA-%' THEN
        md5(lower(repo || '|' || cve_id || '|' || split_part(COALESCE(package, ''), ' ', 1)))
      ELSE
        md5(lower(COALESCE(scanner, '') || '|' || COALESCE(file_path, '') || '|'
                  || COALESCE(line_number::text, '') || '|' || COALESCE(description, '')))
      END
    WHERE fingerprint IS NULL;

    -- In-dashboard user feedback. user_id is nullable/SET NULL so feedback
    -- survives an account deletion as anonymous rather than vanishing. The
    -- email-alerter's daily loop emails a digest of rows where notified_at IS
    -- NULL, then stamps them so they aren't re-sent.
    CREATE TABLE IF NOT EXISTS feedback (
      id          UUID PRIMARY KEY DEFAULT gen_random_uuid(),
      user_id     UUID REFERENCES users(id) ON DELETE SET NULL,
      category    TEXT,                        -- bug | idea | other
      message     TEXT NOT NULL,
      page        TEXT,                        -- where it was sent from
      created_at  TIMESTAMPTZ NOT NULL DEFAULT now(),
      notified_at TIMESTAMPTZ                  -- set once included in a digest
    );
    CREATE INDEX IF NOT EXISTS idx_feedback_unnotified ON feedback (created_at) WHERE notified_at IS NULL;
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgresql-init-schema
  namespace: baghguard
spec:
  # No ttlSecondsAfterFinished: this Job must persist after completion so
  # ArgoCD sees it already matches desired state. If the completed Job gets
  # garbage-collected, every auto-sync recreates it and reruns init.sql
  # against the live DB - harmless while the script stays idempotent, but a
  # future non-idempotent migration would then silently re-execute every
  # sync interval. If this schema needs to change, give the Job a new name
  # (e.g. a version/date suffix) rather than editing this one in place.
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init-schema
        image: postgres:15-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h postgresql -U baghguard; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          PGPASSWORD=$POSTGRES_PASSWORD psql -h postgresql -U baghguard -d baghguard -f /schema/init.sql
          echo "Schema initialized successfully"
        envFrom:
        - secretRef:
            name: postgresql-secret
        volumeMounts:
        - name: schema
          mountPath: /schema
      volumes:
      - name: schema
        configMap:
          name: postgresql-init-schema
