apiVersion: v1
kind: ConfigMap
metadata:
  name: scanner-config
  namespace: baghguard
data:
  # Union of every user's selected repos, regenerated by config-ui on each
  # save as "username::repo_url" lines - empty until someone signs in and
  # picks repos. Notification settings live per-user in Postgres now, not
  # here.
  TARGET_REPOS: ""
  # Scan output directory
  OUTPUT_DIR: /results
  # Severity threshold
  SEVERITY_THRESHOLD: MEDIUM
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scan-results-pvc
  namespace: baghguard
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
