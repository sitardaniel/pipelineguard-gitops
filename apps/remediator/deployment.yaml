apiVersion: apps/v1
kind: Deployment
metadata:
  name: remediator
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: remediator
  template:
    metadata:
      labels:
        app: remediator
    spec:
      serviceAccountName: remediator
      containers:
      - name: remediator
        image: ghcr.io/sitardaniel/baghguard-remediator:latest
        # Always, not IfNotPresent: the tag is a floating :latest published by
        # CI on every push - IfNotPresent would keep serving whatever digest
        # a node happened to cache first, silently ignoring new builds.
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: POLL_INTERVAL
          value: "300"
        - name: ALERT_SEVERITIES
          value: "CRITICAL,HIGH"
        resources:
          limits:
            memory: "128Mi"
            cpu: "100m"
          requests:
            memory: "64Mi"
            cpu: "50m"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: remediator
  namespace: baghguard
