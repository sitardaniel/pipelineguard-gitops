apiVersion: v1
kind: Secret
metadata:
  name: config-ui-secret
  namespace: baghguard
type: Opaque
stringData:
  # Populate with kubectl once the GitHub OAuth App is registered - never
  # commit real values. Deliberately kept in its own file, separate from
  # deployment.yaml: `kubectl apply -f apps/config-ui/deployment.yaml` to
  # land a quick Deployment-only change (e.g. bypassing a slow ArgoCD
  # sync) must not be able to reset these back to blank as a side effect.
  # ArgoCD's own sync/selfHeal is separately blocked from touching this via
  # `ignoreDifferences` on the Secret in argocd-apps/config-ui.yaml.
  GITHUB_OAUTH_CLIENT_ID: ""
  GITHUB_OAUTH_CLIENT_SECRET: ""
  OAUTH_REDIRECT_URI: "http://localhost:8080/auth/callback"
