apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-ui
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-ui
  template:
    metadata:
      labels:
        app: config-ui
    spec:
      serviceAccountName: config-ui
      containers:
      - name: config-ui
        image: ghcr.io/sitardaniel/baghguard-config-ui:46afc6013279e2b728feb2f0c8caf1468ceb5660
        # Always, not IfNotPresent: the tag is a floating :latest published by
        # CI on every push - IfNotPresent would keep serving whatever digest
        # a node happened to cache first, silently ignoring new builds.
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: GITHUB_OAUTH_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: config-ui-secret
              key: GITHUB_OAUTH_CLIENT_ID
              optional: true
        - name: GITHUB_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: config-ui-secret
              key: GITHUB_OAUTH_CLIENT_SECRET
              optional: true
        - name: OAUTH_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: config-ui-secret
              key: OAUTH_REDIRECT_URI
              optional: true
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: LAUNCH_AT
          value: "2026-07-16T07:00:00Z"
        - name: ADMIN_GITHUB_USERNAMES
          value: "sitardaniel"
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-host
              optional: true
        - name: SMTP_PORT
          value: "587"
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-user
              optional: true
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: smtp-password
              optional: true
        - name: SMTP_USE_TLS
          value: "true"
        - name: ALERT_EMAIL_FROM
          valueFrom:
            secretKeyRef:
              name: email-alerter-secret
              key: alert-email-from
              optional: true
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: config-ui
  namespace: baghguard
spec:
  type: NodePort
  selector:
    app: config-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-ui
  namespace: baghguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-ui-role
  namespace: baghguard
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-ui-rolebinding
  namespace: baghguard
subjects:
- kind: ServiceAccount
  name: config-ui
  namespace: baghguard
roleRef:
  kind: Role
  name: config-ui-role
  apiGroup: rbac.authorization.k8s.io
