apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-ui
  namespace: pipelineguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-ui
  template:
    metadata:
      labels:
        app: config-ui
    spec:
      serviceAccountName: config-ui
      containers:
      - name: config-ui
        image: ghcr.io/sitardaniel/pipelineguard-config-ui:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: GITHUB_USERNAME
          valueFrom:
            secretKeyRef:
              name: config-ui-secret
              key: GITHUB_USERNAME
              optional: true
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: config-ui-secret
              key: GITHUB_TOKEN
              optional: true
        - name: CONFIG_FILE
          value: /config/repos.txt
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: config
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: config-ui
  namespace: pipelineguard
spec:
  type: NodePort
  selector:
    app: config-ui
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: config-ui
  namespace: pipelineguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: config-ui-role
  namespace: pipelineguard
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: config-ui-rolebinding
  namespace: pipelineguard
subjects:
- kind: ServiceAccount
  name: config-ui
  namespace: pipelineguard
roleRef:
  kind: Role
  name: config-ui-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: config-ui-secret
  namespace: pipelineguard
type: Opaque
stringData:
  GITHUB_USERNAME: "sitardaniel"
  GITHUB_TOKEN: ""
