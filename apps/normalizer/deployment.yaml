apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-normalizer
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-normalizer
  template:
    metadata:
      labels:
        app: result-normalizer
    spec:
      containers:
      - name: normalizer
        image: ghcr.io/sitardaniel/baghguard-result-normalizer:46afc6013279e2b728feb2f0c8caf1468ceb5660
        # Always, not IfNotPresent: the tag is a floating :latest published by
        # CI on every push - IfNotPresent would keep serving whatever digest
        # a node happened to cache first, silently ignoring new builds.
        imagePullPolicy: Always
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: RESULTS_DIR
          value: /results
        - name: POLL_INTERVAL
          value: "30"
        volumeMounts:
        - name: results
          mountPath: /results
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: scan-results-pvc
