apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-normalizer
  namespace: baghguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-normalizer
  template:
    metadata:
      labels:
        app: result-normalizer
    spec:
      containers:
      - name: normalizer
        image: ghcr.io/sitardaniel/baghguard-result-normalizer:bc369701cd965ef5a4d3b1cb1d185cd5e08dba2f
        # IfNotPresent, not Always: the tag is now the immutable commit SHA
        # that built it (bumped in this manifest by build-images.yml's
        # update-gitops-manifests job) - a given tag never points to a
        # different image, so there's nothing to re-check on every restart.
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgresql
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: baghguard
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgresql-secret
              key: POSTGRES_PASSWORD
        - name: RESULTS_DIR
          value: /results
        - name: POLL_INTERVAL
          value: "30"
        volumeMounts:
        - name: results
          mountPath: /results
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "50m"
      volumes:
      - name: results
        persistentVolumeClaim:
          claimName: scan-results-pvc
